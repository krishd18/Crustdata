[project]
name = "datadesigner"
version = "0.1.0"
description = "Data Designer — every claim a counterparty makes, checked before you sign (ContextCon 05)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "pydantic-settings>=2.2",
  "httpx>=0.27", "tenacity>=8.2", "anthropic", "pyyaml>=6.0", "jinja2>=3.1",
  "structlog>=24.1", "rapidfuzz>=3.6", "python-dateutil>=2.9", "pymupdf>=1.24",
  "pdfplumber>=0.11", "python-pptx>=0.6.23", "openpyxl>=3.1", "markdown>=3.6", "aiosmtpd>=1.4",
]
[project.optional-dependencies]
pdf = ["weasyprint>=61"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "coverage>=7.4", "ruff>=0.4", "mypy>=1.10", "playwright>=1.45"]
[tool.ruff]
line-length = 110
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["datadesigner*", "verification*"]
[project.scripts]
datadesigner = "datadesigner.cli:main"
